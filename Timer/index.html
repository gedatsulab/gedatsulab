<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Minimalist Desktop PWA Timer with one-click presets, custom duration, Web Audio crystal chime, and desktop notifications.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Timer</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <!-- Active Alarm Banner (Appears on Time-Up) -->
    <div id="alarm-banner" class="alarm-banner hidden" role="alert" aria-live="assertive">
      <div class="alarm-banner-content">
        <span class="alarm-pulse-icon">🔔</span>
        <div class="alarm-text-group">
          <strong id="alarm-banner-title">Time's Up!</strong>
          <span id="alarm-banner-desc">The timer has finished.</span>
        </div>
      </div>
      <button id="stop-alarm-btn" type="button" class="btn btn-danger-glow">
        Stop Alarm (Space / Esc)
      </button>
    </div>

    <!-- Main 2-Column Layout -->
    <main class="main-grid">
      <!-- Left Column: Main Timer Display & Controls -->
      <section class="card timer-stage-card" aria-label="Main Timer">
        <div class="timer-status-bar">
          <span id="active-timer-label" class="timer-tag">Standby</span>
          <div class="status-bar-right">
            <span id="finish-time-estimate" class="finish-estimate">Ends --:--</span>
            <button id="notify-perm-btn" type="button" class="pill-btn compact-pill" title="Configure desktop notifications">
              <span class="status-dot" id="notify-dot"></span>
              <span id="notify-label">Enable Alerts</span>
            </button>
          </div>
        </div>

        <!-- Interactive Digital Timer Display Button (Click to Start / Stop) -->
        <button type="button" class="timer-display-box" id="start-stop-btn" title="Click to Start / Stop (Space)">
          <div id="time-display" class="time-display" aria-live="off">25:00</div>
          <div class="display-action-row">
            <span class="action-pill" id="action-pill">
              <svg id="play-stop-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="6 4 20 12 6 20 6 4"></polygon>
              </svg>
              <span id="start-stop-label">Click to Start</span>
            </span>
            <span id="total-duration-sub" class="total-duration-sub">Total: 25m</span>
          </div>
          <div class="progress-bar-track" aria-hidden="true">
            <div id="progress-bar-fill" class="progress-bar-fill"></div>
          </div>
        </button>

        <!-- Quick Add Buttons during or before timer -->
        <div class="quick-adjust-row">
          <button type="button" class="chip-btn" data-add-seconds="60">+1m</button>
          <button type="button" class="chip-btn" data-add-seconds="300">+5m</button>
          <button type="button" class="chip-btn" data-add-seconds="10">+10s</button>
          <button type="button" class="chip-btn" data-add-seconds="-10">-10s</button>
        </div>
      </section>

      <!-- Right Column: One-Click Presets (Top) & Custom Time Input (Bottom) -->
      <div class="side-column">
        <!-- Presets Section -->
        <section class="card presets-card" aria-label="Presets">
          <!-- Preset Grid -->
          <div id="preset-grid" class="preset-grid"></div>

          <!-- Add New Preset Form -->
          <form id="add-preset-form" class="add-preset-form" autocomplete="off">
            <div class="preset-form-row">
              <input
                type="text"
                id="preset-name-input"
                class="input-field preset-name-input"
                placeholder="Preset name"
                maxlength="24"
                required
              >
              <div class="compact-time-inputs">
                <label class="time-unit-box">
                  <input type="number" id="preset-min-input" min="0" max="999" value="15" required>
                  <span>m</span>
                </label>
                <label class="time-unit-box">
                  <input type="number" id="preset-sec-input" min="0" max="59" value="0" required>
                  <span>s</span>
                </label>
              </div>
              <button type="submit" class="btn btn-accent">
                + Save
              </button>
            </div>
          </form>
        </section>

        <!-- Custom Time Specification Section -->
        <section class="card custom-card" aria-label="Custom Duration">
          <form id="custom-timer-form" class="custom-timer-form" autocomplete="off">
            <div class="hms-inputs-grid">
              <div class="hms-box">
                <label for="custom-hours">HR</label>
                <div class="stepper-wrap">
                  <input type="number" id="custom-hours" min="0" max="99" value="0">
                </div>
              </div>
              <span class="hms-colon">:</span>
              <div class="hms-box">
                <label for="custom-minutes">MIN</label>
                <div class="stepper-wrap">
                  <input type="number" id="custom-minutes" min="0" max="999" value="10">
                </div>
              </div>
              <span class="hms-colon">:</span>
              <div class="hms-box">
                <label for="custom-seconds">SEC</label>
                <div class="stepper-wrap">
                  <input type="number" id="custom-seconds" min="0" max="59" value="0">
                </div>
              </div>
            </div>

            <div class="custom-actions">
              <button type="submit" class="btn btn-primary full-width">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <polygon points="6 4 20 12 6 20 6 4"></polygon>
                </svg>
                <span>Start</span>
              </button>
              <button type="button" id="custom-set-only-btn" class="btn btn-secondary" title="Set duration without starting">
                Set
              </button>
            </div>
          </form>
        </section>
      </div>
    </main>
    <footer class="app-footer">Copyright 2026 Gedatsu Lab</footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
